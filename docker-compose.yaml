name: agent-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Postgres has no native Prometheus /metrics endpoint of its own — this is
  # the standard community exporter, translating pg_stat_*/pg_settings into
  # scrapeable metrics. Waits on `ingest` (not just `postgres`) because the
  # postgres_exporter role it connects as is created by sql/schema.sql, which
  # ingest applies — starting before that would just loop on auth failures.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres_exporter:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      ingest:
        condition: service_completed_successfully
    ports:
      - "9187:9187"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "4000:4000"
    restart: unless-stopped

  ingest:
    build: ./ingest
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_AGENT_RO_PASSWORD: ${POSTGRES_AGENT_RO_PASSWORD}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
      DATA_DIR: /data/raw
      SCHEMA_FILE: /sql/schema.sql
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      EMBEDDING_MODEL: text-embedding-3-small
      NEWS_EMBED_LIMIT: ${NEWS_EMBED_LIMIT:-10000}
      NEWS_ROWS_LIMIT: ${NEWS_ROWS_LIMIT:-0}
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      EXPORT_OVERWRITE: ${EXPORT_OVERWRITE:-false}
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/export:/data/export
      - ./sql:/sql:ro
    restart: "no"

  agent:
    build: ./agent
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgresql://agent_ro:${POSTGRES_AGENT_RO_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-claude-agent}
      EMBEDDING_MODEL: text-embedding-3-small
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Strands' StrandsTelemetry reads this for the trace resource's
      # service.name (defaults to "strands-agents" otherwise) — the old
      # manual TracerProvider setup hardcoded the same value in Python
      # (observability.py's SERVICE_NAME), now sourced from the environment
      # instead, standard OTel convention.
      OTEL_SERVICE_NAME: agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8000:8000"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.4.3
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    ports:
      - "12346:12345"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
  lokidata:
