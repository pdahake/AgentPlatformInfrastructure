global:
  scrape_interval: 10s

scrape_configs:
  - job_name: agent
    static_configs:
      - targets: ["agent:8000"]

  # Uniform "is it up" probing across every service via blackbox_exporter —
  # covers services with no native Prometheus /metrics endpoint of their own
  # (postgres, jaeger, grafana, otel-collector, alloy), not just the agent.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://litellm:4000/health/liveliness
          - http://agent:8000/health
          - http://jaeger:16686/
          - http://prometheus:9090/-/healthy
          - http://loki:3100/ready
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - otel-collector:4317
          - alloy:12345
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
