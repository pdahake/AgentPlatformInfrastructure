receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
# Metrics are scraped directly from the agent's /metrics endpoint by
# Prometheus (see observability/prometheus.yml) rather than routed through
# this collector — the agent only emits traces over OTLP.
