# Uniform "is this service reachable" probing across every service in the
# stack, regardless of whether it exposes its own Prometheus metrics —
# that's the whole point of using blackbox_exporter here instead of relying
# on each service's own /metrics endpoint (only a couple of them have one).
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: []  # defaults to 2xx-3xx
  tcp_connect:
    prober: tcp
    timeout: 5s
